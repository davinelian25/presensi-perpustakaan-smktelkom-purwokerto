<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Perpustakaan SMK Telkom Purwokerto</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .ribbon-badge {
            clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
        }
    </style>
</head>
<body>
    <!-- Konten Utama Web Presensi -->
    <div id="app" class="min-h-screen flex flex-col justify-between">
        <div class="p-6 max-w-7xl mx-auto w-full">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">DATA PRESENSI PERPUSTAKAAN SMK TELKOM PURWOKERTO</h1>
            <p class="text-gray-600 mb-6">Silakan lakukan Login atau Check-In menggunakan akun Anda.</p>
            
            <!-- Area Status Koneksi -->
            <div id="status-koneksi" class="bg-white p-4 rounded-lg shadow mb-6">
                <span class="text-sm font-medium text-gray-500">Status Sistem: </span>
                <span id="db-status" class="text-sm font-bold text-emerald-600">Menghubungkan ke Supabase...</span>
            </div>
        </div>
    </div>

    <!-- Script Koneksi Supabase & Logika Utama -->
    <script>
        // Konfigurasi Supabase Project
        const SUPABASE_URL = 'https://uhnqaxsxoumkfydymuez.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RzHsdyCF31nuNGMR0keEw_toHN4';
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log("Supabase berhasil diinisialisasi!");
                document.getElementById('db-status').innerText = 'Terhubung ke Database (Online)';
                document.getElementById('db-status').className = 'text-sm font-bold text-emerald-600';
            } else {
                document.getElementById('db-status').innerText = 'Gagal memuat library Supabase!';
                document.getElementById('db-status').className = 'text-sm font-bold text-red-600';
            }
        } catch (err) {
            console.error("Error inisialisasi:", err);
            document.getElementById('db-status').innerText = 'Error Koneksi: ' + err.message;
            document.getElementById('db-status').className = 'text-sm font-bold text-red-600';
        }

        // Global State Aplikasi
        let currentUser = null;
        let activeTab = 'dashboard';
        let currentRangeFilter = 'week';
        let currentJurusanFilter = 'all';

        let chartInst = null;
        let barChartInst = null;
        let mainPieInst = null;
    </script>
</body>
</html>
